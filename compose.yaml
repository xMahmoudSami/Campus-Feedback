name: student_feedback_system

services:
  database:
    build:
      context: ./database
    container_name: feedback-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d student_feedback_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: feedback-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: feedback_user
      DB_PASSWORD: feedback_password
      DB_NAME: student_feedback_db
      JWT_SECRET: d55935d4d295336f137283dc35136df8dbb728c6482780f4c400ea1faf7adca096c291ca38f9f34608f87af855392e7e7eabfd7090944d21ff63f4ab4a62574d
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: admin123
      INITIAL_STUDENT_USERNAME: student
      INITIAL_STUDENT_EMAIL: student@example.com
      INITIAL_STUDENT_PASSWORD: student123
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./database/seeds:/app/database/seeds
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: feedback-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
