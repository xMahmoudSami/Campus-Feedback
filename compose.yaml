services:
  database:
    build:
      context: ./database
    environment:
      POSTGRES_DB: student_feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:8080
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: feedback_user
      DB_PASSWORD: feedback_password
      DB_NAME: student_feedback_db
      DB_SSL: "false"
      JWT_SECRET: local_development_change_this_to_a_long_random_secret
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
