services:
  database:
    build:
      context: ./database
    container_name: feedback-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d student_feedback_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: feedback-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: feedback_user
      DB_PASSWORD: feedback_password
      DB_NAME: student_feedback_db
      JWT_SECRET: dev_jwt_secret_student_feedback_system_change_in_production
    volumes:
      - ./backend/src:/app/src
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: feedback-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
