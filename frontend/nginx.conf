server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html login.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Security and cache-busting headers globally
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Clear-Site-Data '"cache"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;

    # HTML files – explicitly enforce no-store
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
        try_files $uri =404;
    }

    # Static scripts and styles – revalidate for instant updates
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Media and fonts
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # SPA-style fallback for HTML pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit routes (optional clarity)
    location = /login.html {
        try_files /login.html =404;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
    }

    location /student/ {
        try_files $uri $uri/ =404;
    }

    # Health for container orchestration
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
