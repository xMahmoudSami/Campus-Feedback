<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take Survey – Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">SF</div>
        <div class="sidebar-title">Student Feedback<br />System</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">
          Dashboard
        </a>
        <a class="nav-item active" data-page="surveys" href="surveys.html">
          Surveys
        </a>
        <a class="nav-item" data-page="feedback" href="feedback.html">
          Feedback
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" data-user-initials>S</div>
          <div class="user-details">
            <div class="user-name" data-user-name>Student</div>
            <div class="user-email" data-user-email>student@example.com</div>
          </div>
        </div>
        <button class="btn-logout" data-logout>Logout</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle menu-toggle-bars" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        </div>
        <div class="topbar-right">
          <div class="topbar-user"><span data-user-name>Student</span></div>
        </div>
      </header>

      <div class="page-body">
        <div id="survey-form"></div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/student-survey.js"></script>
</body>
</html>
