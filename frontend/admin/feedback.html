<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback – Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=5" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">SF</div>
        <div class="sidebar-title">Student Feedback<br />System</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">
          Dashboard
        </a>
        <a class="nav-item" data-page="surveys" href="surveys.html">
          Surveys
        </a>
        <a class="nav-item active" data-page="feedback" href="feedback.html">
          Feedback
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" data-user-initials><img src="../assets/admin.svg" alt="Admin" class="role-avatar-img"></div>
          <div class="user-details">
            <div class="user-name" data-user-name>Admin</div>
            <div class="user-email" data-user-email>admin@example.com</div>
          </div>
        </div>
        <button class="btn-logout" data-logout>Logout</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="page-body">
        <div class="page-header">
          <h1>Student Feedback</h1>
          <p>All feedback submitted by students</p>
        </div>

        <div class="card">
          <div class="card-body" id="feedback-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js?v=5"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/ui.js?v=5"></script>
  <script src="../js/pages/admin-feedback.js?v=5"></script>
</body>
</html>
