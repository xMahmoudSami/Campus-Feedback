<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Survey – Campus Feedback</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=5" />
</head>
<body>
  <div class="app-layout">
    <!-- Standalone Sidebar Mount -->
    <aside class="sidebar" data-active="surveys"></aside>

    <div class="main-content">
      <div class="page-body">
        <div class="page-header">
          <h1 id="page-title">Create Survey</h1>
          <p>Design your survey with text, multiple-choice, or rating questions</p>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="form-group">
              <label class="form-label" for="survey-title">Title <span class="required">*</span></label>
              <input type="text" id="survey-title" class="form-control" placeholder="e.g. Course Evaluation – Spring 2025" />
            </div>
            <div class="form-group">
              <label class="form-label" for="survey-description">Description</label>
              <textarea id="survey-description" class="form-control" rows="2" placeholder="Brief description of the survey purpose"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="survey-due">Due Date</label>
              <input type="date" id="survey-due" class="form-control" style="max-width:220px" />
            </div>
          </div>
        </div>

        <div class="d-flex justify-between align-center mb-2">
          <h3 style="font-size:1.05rem;font-weight:600">Questions</h3>
          <button type="button" id="add-question-btn" class="btn btn-outline">+ Add Question</button>
        </div>

        <div id="questions-list"></div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" id="save-draft-btn" class="btn btn-secondary">Save Draft</button>
          <button type="button" id="publish-btn" class="btn btn-primary">Publish</button>
          <a href="surveys.html" class="btn btn-outline">Cancel</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js?v=5"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/components/sidebar.js?v=5"></script>
  <script src="../js/ui.js?v=5"></script>
  <script src="../js/pages/admin-create-survey.js?v=5"></script>
</body>
</html>
